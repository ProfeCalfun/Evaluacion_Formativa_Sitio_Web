<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de JS</title>

    <script>
        // Código JavaScript aquí
        function apagarAmpolleta(){
            document.getElementById("imgEncendida").src="../img/apagada.jpg"; // Ocultar la imagen encendida al cargar la página
        }

        function encenderAmpolleta(){
            document.getElementById("imgEncendida").src="../img/encendida.jpg"; // Mostrar la imagen encendida al cargar la página
        }
        
    </script>
</head>
<body>
    <h1 style="text-align: center;">Ejemplo de JavaScript</h1>
    <div style="display: flex; justify-content: center; align-items: center;">
    <img id="imgEncendida" style="align-items: center;" alt="Imagen encendida">;
   </div>
   <div style="display: flex; justify-content: center; align-items: center;">
    <button style="margin: 10px;" onclick="apagarAmpolleta()">Apagar ampolleta</button>
    <button style="margin: 10px;" onclick="encenderAmpolleta()">Encender ampolleta</button>
    </div>
</body>
</html>
